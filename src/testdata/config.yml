automation:
  enabled: true
  rules:
    - patterns:
        - "*.md"
        - "*.txt"
      profile: default

profiles:
  default:
    duration: 5m
    pass_threshold: 50
    allowed_voters: {}

  profile1:
    duration: 10m
    pass_threshold: 75
    allowed_voters:
      teams:
        - team1
      users:
        - user1
        - user2

  profile2:
    duration: 10m
    pass_rule:
      type: vote_count
      minimum_approvals: 3
      maximum_rejections: 0
    allowed_voters:
      teams:
        - team1
