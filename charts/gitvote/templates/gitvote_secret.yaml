{{- include "chart.validateStrings" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.resourceNamePrefix" . }}gitvote-config
type: Opaque
stringData:
  gitvote.yml: |-
    addr: {{ .Values.gitvote.addr | quote }}
    db:
      host: {{ default (printf "%s-postgresql.%s" .Release.Name .Release.Namespace) .Values.db.host | quote }}
      port: {{ .Values.db.port | int }}
      dbname: {{ .Values.db.dbname | quote }}
      user: {{ .Values.db.user | quote }}
      password: {{ .Values.db.password | quote }}
    log:
      format: {{ .Values.log.format | quote }}
    github:
      appId: {{ include "chart.githubAppID" . }}
      appPrivateKey: {{ .Values.gitvote.github.appPrivateKey | quote }}
      webhookSecret: {{ .Values.gitvote.github.webhookSecret | quote }}
      {{- with .Values.gitvote.github.webhookSecretFallback }}
      webhookSecretFallback: {{ . | quote }}
      {{- end }}

